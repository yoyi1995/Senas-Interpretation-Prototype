server {
    listen 80;
    server_name _;  # Acepta cualquier nombre de host [[3]]

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;  # Corrección: Elimina `=404` para evitar errores 404 en rutas dinámicas de Angular 
    }

    location /socket.io/ {
        proxy_pass http://senas-interpretation-prototype-node.up.railway.app:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
