server {
    listen 80;
    server_name _;  # Acepta cualquier nombre de host (útil para servidores por defecto) [[3]]

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ =404;  # Evita problemas con rutas dinámicas de Angular [[8]]
    }

    # Configuración opcional para WebSockets (si usas Socket.IO)
    location /socket.io/ {
        proxy_pass http://senas-interpretation-prototype-node.up.railway.app:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
