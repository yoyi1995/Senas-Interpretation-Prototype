server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy solo si el dominio responde y lo necesitas.
    # Comenta esta sección si no estás usando sockets todavía.
